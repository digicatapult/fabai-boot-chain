name: Release

# Stable releases: a maintainer pushes ovmf-edk2-stableYYYYMM[.NN]-rN on a
# commit on main. The images are attested by this workflow's own job, so
#   gh attestation verify --signer-workflow <repo>/.github/workflows/release.yml
# accepts stable images only; HEAD images are signed by release-head.yml.

on:
  push:
    tags:
      - "ovmf-edk2-stable*-r*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      edk2-tag: ${{ steps.check.outputs.edk2-tag }}
      edk2-rev: ${{ steps.check.outputs.edk2-rev }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag against flake.lock and main
        id: check
        run: bash scripts/release/check-stable-tag.sh
        env:
          TAG: ${{ github.ref_name }}

  build:
    name: Firmware
    needs: check-tag
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: [check-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble release
        run: bash scripts/release/assemble.sh
        env:
          TRACK: stable
          TAG: ${{ github.ref_name }}
          EDK2_REF: refs/tags/${{ needs.check-tag.outputs.edk2-tag }}
          EDK2_REV: ${{ needs.check-tag.outputs.edk2-rev }}
          CC_SHA256: ${{ needs.build.outputs.cc-sha256 }}
          NONCC_SHA256: ${{ needs.build.outputs.noncc-sha256 }}
          ARTIFACTS: artifacts
          DIST: dist
          NOTES: ${{ runner.temp }}/notes.md

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/OVMF.fd
            dist/OVMF-noncc.fd

      - name: Publish release
        run: bash scripts/release/publish.sh
        env:
          TRACK: stable
          TAG: ${{ github.ref_name }}
          TITLE: OVMF ${{ github.ref_name }}
          DIST: dist
          NOTES: ${{ runner.temp }}/notes.md
          GH_TOKEN: ${{ github.token }}

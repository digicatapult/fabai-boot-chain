name: Build

# The verified firmware build, shared by test.yml and both release workflows:
# every variant built on two runner images and rebuilt from scratch, all three
# byte-identical; boot-tested; the NON_CC_BUILD patch shown inert for cc; and
# the licence texts for what was compiled in.
#
# Nothing here signs or publishes. Attestations are made by the calling
# release workflow's own jobs, so their signer identity is that workflow, not
# this one.

on:
  workflow_call:
    inputs:
      edk2-rev:
        description: >-
          Commit on tianocore/edk2 master to build instead of the revision in
          flake.lock (HEAD track). Empty builds flake.lock.
        type: string
        default: ""
    outputs:
      cc-sha256:
        description: SHA-256 of OVMF.fd, identical on every builder.
        value: ${{ jobs.compare.outputs.cc-sha256 }}
      noncc-sha256:
        description: SHA-256 of OVMF-noncc.fd, identical on every builder.
        value: ${{ jobs.compare.outputs.noncc-sha256 }}
      edk2-rev:
        description: The edk2 commit that was built.
        value: ${{ jobs.compare.outputs.edk2-rev }}

permissions: {}

jobs:
  # Fetches edk2 (with submodules) and nixpkgs once into the Actions cache,
  # unless flake.lock's inputs are already cached; every other job imports
  # them from there (.github/actions/{fetch,restore}-inputs).
  flake-inputs:
    name: Flake inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.fetch.outputs.cache-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Fetch flake inputs
        id: fetch
        uses: ./.github/actions/fetch-inputs
        with:
          edk2-rev: ${{ inputs.edk2-rev }}

  # Each variant is built on two runner images. On the first, it is then built
  # again from scratch, which Nix compares byte for byte with the first build,
  # and boot-tested.
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.runner }})
    needs: flake-inputs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [cc, noncc]
        runner: [ubuntu-24.04, ubuntu-22.04]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Restore flake inputs
        uses: ./.github/actions/restore-inputs
        with:
          cache-key: ${{ needs.flake-inputs.outputs.cache-key }}

      - name: Build
        run: nix build --print-build-logs --out-link result ".#ovmf-${VARIANT}"

      - name: Rebuild and compare
        id: rebuild
        if: matrix.runner == 'ubuntu-24.04'
        run: nix build --rebuild --keep-failed --out-link result ".#ovmf-${VARIANT}"

      - name: Keep both images if the rebuild differs
        if: failure() && steps.rebuild.outcome == 'failure'
        run: |
          mkdir -p nondeterministic
          out="$(readlink -f result)"
          for dir in "$out" "${out}.check"; do
            if [[ -d "$dir" ]]; then
              cp -r "$dir" "nondeterministic/$(basename "$dir")"
            fi
          done

      - name: Upload both images if the rebuild differs
        if: failure() && steps.rebuild.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nondeterministic-${{ matrix.variant }}-${{ matrix.runner }}
          path: nondeterministic
          if-no-files-found: ignore

      # BUILD.json and flake.lock (as re-locked for HEAD builds) feed the
      # release's PROVENANCE.txt, so the release job needs no Nix.
      - name: Record digest
        run: |
          mkdir -p out
          cp result/*.fd flake.lock out/
          nix eval --json ".#ovmf-${VARIANT}" \
            --apply 'p: { inherit (p) drvPath variant target toolchain buildArgs image; }' |
            jq --arg nix "$(nix --version)" '. + { nix: $nix }' > out/BUILD.json
          (cd out && sha256sum -- *.fd > SHA256SUMS)
          cat out/BUILD.json out/SHA256SUMS
          {
            printf '### %s on %s\n\n```\n' "$VARIANT" "$RUNNER"
            cat out/SHA256SUMS
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RUNNER: ${{ matrix.runner }}

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ovmf-${{ matrix.variant }}-${{ matrix.runner }}
          path: out
          if-no-files-found: error

      # noncc must boot a test kernel and cc must refuse to (nix/boot-test.nix).
      # On failure, the build log ends with the tail of both console logs.
      - name: Boot test
        id: boot-test
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          nix build --print-build-logs --out-link boot-test ".#verify.boot-${VARIANT}"
          mkdir -p boot-logs
          cp boot-test/*.log boot-logs/

      # Not named ovmf-*, which the compare job downloads.
      - name: Upload boot logs
        if: steps.boot-test.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-logs-${{ matrix.variant }}
          path: boot-logs
          if-no-files-found: error

  # Two independent builders must produce the same bytes.
  compare:
    name: Compare builders
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      cc-sha256: ${{ steps.digests.outputs.cc-sha256 }}
      noncc-sha256: ${{ steps.digests.outputs.noncc-sha256 }}
      edk2-rev: ${{ steps.digests.outputs.edk2-rev }}
    steps:
      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ovmf-*
          path: artifacts

      - name: Compare digests
        id: digests
        run: |
          status=0
          for variant in cc noncc; do
            first="artifacts/ovmf-${variant}-ubuntu-24.04"
            second="artifacts/ovmf-${variant}-ubuntu-22.04"
            if ! cmp -s "$first/BUILD.json" "$second/BUILD.json" ||
              ! cmp -s "$first/flake.lock" "$second/flake.lock"; then
              printf '%s: the runners evaluated different derivations\n' "$variant"
              status=1
            elif ! cmp -s "$first/SHA256SUMS" "$second/SHA256SUMS"; then
              printf '%s: images differ between runners\n' "$variant"
              status=1
            else
              printf '%s: identical\n' "$variant"
              printf '%s-sha256=%s\n' "$variant" "$(cut -d ' ' -f 1 "$first/SHA256SUMS")" >> "$GITHUB_OUTPUT"
            fi
            cat "$first/SHA256SUMS" "$second/SHA256SUMS"
          done
          if ! cmp -s artifacts/ovmf-cc-ubuntu-24.04/flake.lock artifacts/ovmf-noncc-ubuntu-24.04/flake.lock; then
            printf 'cc and noncc were built from different flake.lock files\n'
            status=1
          fi
          printf 'edk2-rev=%s\n' "$(jq -r .nodes.edk2.locked.rev artifacts/ovmf-cc-ubuntu-24.04/flake.lock)" >> "$GITHUB_OUTPUT"
          exit "$status"

  # The NON_CC_BUILD patch is applied to both variants, so it must not change
  # the cc image while NON_CC_BUILD is FALSE.
  patch-inert:
    name: Patch is inert for cc
    needs: flake-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Restore flake inputs
        uses: ./.github/actions/restore-inputs
        with:
          cache-key: ${{ needs.flake-inputs.outputs.cache-key }}

      - name: Build with and without the patch
        run: |
          nix build --print-build-logs --out-link patched .#ovmf-cc
          nix build --print-build-logs --out-link unpatched .#verify.cc-unpatched

      - name: Compare
        run: |
          sha256sum patched/OVMF.fd unpatched/OVMF.fd | tee -a "$GITHUB_STEP_SUMMARY"
          cmp patched/OVMF.fd unpatched/OVMF.fd

  # Rebuilds both variants to list what they compile, and fails if third-party
  # code appears that nix/third-party.nix doesn't cover (nix/licences.nix).
  licences:
    name: Licences of compiled code
    needs: flake-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Restore flake inputs
        uses: ./.github/actions/restore-inputs
        with:
          cache-key: ${{ needs.flake-inputs.outputs.cache-key }}

      - name: Scan compiled sources
        run: |
          nix build --print-build-logs --out-link licences .#verify.licences
          mkdir -p out
          cp licences/* out/
          {
            printf '```\n'
            cat out/THIRD-PARTY.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload licences
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licences
          path: out
          if-no-files-found: error

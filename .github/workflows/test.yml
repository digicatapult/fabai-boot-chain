name: Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same verified build the releases use (build.yml).
  firmware:
    name: Firmware
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # actionlint (with ShellCheck), ShellCheck, the workflow pinning policy and
  # the Renovate config, all from the pinned nixpkgs (nix/lint.nix).
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      # Evaluating the firmware packages needs the edk2 source.
      - name: Fetch flake inputs
        uses: ./.github/actions/fetch-inputs

      - name: Flake check
        run: nix flake check --print-build-logs

  # Early warning that a patch needs rebasing before the next edk2 stable
  # release. Advisory only: upstream commits can break it without any change
  # here, so it is not a required check.
  patch-master:
    name: Patches apply to edk2 master
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No checkout and no blobs: git apply --cached fetches only the blobs the
      # patches touch.
      - name: Fetch edk2 master
        run: |
          git clone --quiet --depth 1 --branch master --filter=blob:none --no-checkout \
            https://github.com/tianocore/edk2 "$RUNNER_TEMP/edk2"
          git -C "$RUNNER_TEMP/edk2" read-tree HEAD

      - name: Apply patches
        run: |
          edk2="$RUNNER_TEMP/edk2"
          printf 'tianocore/edk2 master at %s\n\n' "$(git -C "$edk2" rev-parse HEAD)" |
            tee -a "$GITHUB_STEP_SUMMARY"
          for patch in "$PWD"/firmware/edk2/patches/*.patch; do
            git -C "$edk2" apply --cached --verbose "$patch"
          done

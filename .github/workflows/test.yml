name: Test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same verified build the releases use (build.yml).
  firmware:
    name: Firmware
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  # actionlint (with ShellCheck), ShellCheck, the workflow pinning policy and
  # the Renovate config, all from the pinned nixpkgs (nix/lint.nix), and the
  # measurement action's offline tests (nix/measure-snp.nix).
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      # The lint checks of `nix flake check`, without evaluating the firmware
      # packages: those need the edk2 source, and the Firmware jobs evaluate
      # them anyway. Flake inputs are fetched lazily, so edk2 isn't fetched.
      - name: Lint checks
        run: |
          system="$(nix eval --raw --impure --expr builtins.currentSystem)"
          mapfile -t checks < <(nix eval --json ".#checks.${system}" --apply builtins.attrNames | jq -r '.[]')
          nix build --print-build-logs --no-link "${checks[@]/#/.#checks.${system}.}"

  # Early warning that a patch needs rebasing before the next edk2 stable
  # release. Advisory only: upstream commits can break it without any change
  # here, so it is not a required check.
  patch-master:
    name: Patches apply to edk2 master
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No checkout and no blobs: git apply --cached fetches only the blobs the
      # patches touch.
      - name: Fetch edk2 master
        run: |
          git clone --quiet --depth 1 --branch master --filter=blob:none --no-checkout \
            https://github.com/tianocore/edk2 "$RUNNER_TEMP/edk2"
          git -C "$RUNNER_TEMP/edk2" read-tree HEAD

      - name: Apply patches
        run: |
          edk2="$RUNNER_TEMP/edk2"
          printf 'tianocore/edk2 master at %s\n\n' "$(git -C "$edk2" rev-parse HEAD)" |
            tee -a "$GITHUB_STEP_SUMMARY"
          for patch in "$PWD"/firmware/edk2/patches/*.patch; do
            git -C "$edk2" apply --cached --verbose "$patch"
          done

  # The measurement core must reproduce Tinfoil's published measurement, and
  # the FabAI vector for the cc image built above
  # (nix/measure-snp/regression.sh). Advisory only: it depends on Tinfoil's
  # releases and images.tinfoil.sh, and the FabAI vector must be updated
  # whenever the cc image changes, so it is not a required check.
  measurement-regression:
    name: Measurement regression
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/install-nix

      - name: Download cc image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ovmf-cc-ubuntu-24.04
          path: cc

      - name: Build tools
        id: tools
        run: printf 'path=%s\n' "$(nix build --no-link --print-out-paths .#measure-snp-tools)" >> "$GITHUB_OUTPUT"

      - name: Reproduce measurements
        run: bash nix/measure-snp/regression.sh
        env:
          MEASURE_SNP_TOOLS: ${{ steps.tools.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          CC_IMAGE: cc/OVMF.fd
